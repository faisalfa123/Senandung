<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Night Emerald -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#134e4a"/>
      <stop offset="60%" stop-color="#062e2b"/>
      <stop offset="100%" stop-color="#021a18"/>
    </radialGradient>
    
    <!-- Primary Acoustic Teal Gradient -->
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="50%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>

    <!-- Warm Bamboo & Bronze Gradient -->
    <linearGradient id="goldBamboo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>

    <!-- Glowing Leaf Gradient -->
    <linearGradient id="leafGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="60%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Squircle Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect width="510" height="510" x="1" y="1" rx="114" fill="none" stroke="#14b8a6" stroke-width="2" stroke-opacity="0.25"/>

  <!-- Resonator Sound Ring (Lingkaran Akustik Kayu/Kuningan Nusantara) -->
  <circle cx="256" cy="256" r="172" fill="none" stroke="#0f766e" stroke-width="6" stroke-dasharray="14 10" stroke-opacity="0.4"/>
  <circle cx="256" cy="256" r="148" fill="#042f2e" fill-opacity="0.6" stroke="url(#tealGrad)" stroke-width="3" stroke-opacity="0.4"/>

  <!-- Bilah Bambu / Alat Musik Tradisional Akustik (Bambu Gamelan/Angklung/Kolintang Resonator) -->
  <g id="bambooPipes" opacity="0.95">
    <!-- Pipa 1 -->
    <rect x="184" y="210" width="22" height="135" rx="11" fill="url(#tealGrad)"/>
    <ellipse cx="195" cy="216" rx="8" ry="4" fill="#0d9488"/>
    <!-- Pipa 2 (Pusat) -->
    <rect x="220" y="170" width="24" height="175" rx="12" fill="url(#tealGrad)" filter="url(#softGlow)"/>
    <ellipse cx="232" cy="176" rx="9" ry="4.5" fill="#5eead4"/>
    <!-- Pipa 3 -->
    <rect x="258" y="195" width="22" height="150" rx="11" fill="url(#tealGrad)"/>
    <ellipse cx="269" cy="201" rx="8" ry="4" fill="#0d9488"/>
    <!-- Pipa 4 -->
    <rect x="294" y="235" width="20" height="110" rx="10" fill="url(#tealGrad)"/>
    <ellipse cx="304" cy="240" rx="7" ry="3.5" fill="#0f766e"/>
  </g>

  <!-- Daun Bambu Melengkung (Nusantara Eco Acoustic Melody Wave) -->
  <path d="M 145 285 C 190 230, 260 215, 340 185 C 320 225, 265 260, 205 285 C 175 295, 155 292, 145 285 Z" 
        fill="url(#leafGrad)" opacity="0.95"/>
  <path d="M 145 285 Q 245 235 340 185" fill="none" stroke="#a7f3d0" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>

  <!-- Daun Bambu Kedua (Harmoni Anggun) -->
  <path d="M 270 195 C 330 160, 375 180, 400 230 C 365 215, 315 210, 270 195 Z" 
        fill="url(#leafGrad)" opacity="0.85"/>

  <!-- Embun Nada / Titik Suara Melodi -->
  <circle cx="340" cy="185" r="9" fill="#fef08a" filter="url(#softGlow)"/>
  <circle cx="400" cy="230" r="7" fill="#5eead4"/>
  <circle cx="145" cy="285" r="7" fill="#2dd4bf"/>

  <!-- Gelombang Getaran Senandung Nusantara (Acoustic Resonance Waves) -->
  <path d="M 125 210 C 105 235, 105 275, 125 300" fill="none" stroke="#2dd4bf" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <path d="M 100 190 C 75 230, 75 290, 100 330" fill="none" stroke="#14b8a6" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
  
  <path d="M 387 210 C 407 235, 407 275, 387 300" fill="none" stroke="#2dd4bf" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <path d="M 412 190 C 437 230, 437 290, 412 330" fill="none" stroke="#14b8a6" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
</svg>
