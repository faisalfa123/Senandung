<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient: Deep OLED Dark with Emerald Ambient Glow -->
    <radialGradient id="senandungBg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#0a2318"/>
      <stop offset="55%" stop-color="#05120c"/>
      <stop offset="100%" stop-color="#020805"/>
    </radialGradient>

    <!-- Neon Acoustic Green Gradients for Sound Waves -->
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#1db954"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="waveGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="40%" stop-color="#1ed760"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <linearGradient id="ringGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1db954" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Drop Shadow & Neon Aura Filter -->
    <filter id="neonAura" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="12" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Squircle Canvas Background (100% PWA & App Icon Compliant) -->
  <rect width="512" height="512" rx="120" fill="url(#senandungBg)"/>
  <rect width="508" height="508" x="2" y="2" rx="118" fill="none" stroke="url(#ringGlow)" stroke-width="3" stroke-opacity="0.45"/>

  <!-- 2. Concentric Melodic Resonance Rings (Acoustic Chamber) -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.15" stroke-dasharray="8 6"/>
  <circle cx="256" cy="256" r="165" fill="none" stroke="#1db954" stroke-width="2.5" stroke-opacity="0.25"/>

  <!-- 3. Original & Minimalist 'S' Melody Waves (Senandung Harmonic Sound Curves) -->
  <g id="senandungMark" filter="url(#neonAura)">
    <!-- Main Sweeping 'S' Harmonic Ribbon -->
    <path d="M 335 155 
             C 275 125, 175 145, 175 220 
             C 175 295, 335 255, 335 330 
             C 335 405, 230 420, 175 385" 
          fill="none" 
          stroke="url(#waveGrad1)" 
          stroke-width="36" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Inner Echo Wave (Higher Harmonic Frequency Curve) -->
    <path d="M 305 188 
             C 265 168, 205 180, 205 224 
             C 205 275, 305 250, 305 296 
             C 305 348, 245 358, 205 340" 
          fill="none" 
          stroke="url(#waveGrad2)" 
          stroke-width="15" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          stroke-opacity="0.95"/>
  </g>

  <!-- 4. Dynamic Audio Rhythm Waveform Bars on Crests (Sound Pulsation Accent) -->
  <g id="melodyPulsations" filter="url(#subtleGlow)">
    <!-- Top Right Crest Beams -->
    <circle cx="335" cy="155" r="9" fill="url(#goldAccent)"/>
    <circle cx="365" cy="140" r="5" fill="#6ee7b7" opacity="0.8"/>
    <circle cx="390" cy="130" r="3.5" fill="#1db954" opacity="0.5"/>

    <!-- Center Bridge Wave Nodes -->
    <circle cx="256" cy="275" r="6" fill="#1ed760" opacity="0.9"/>

    <!-- Bottom Left Crest Beams -->
    <circle cx="175" cy="385" r="9" fill="url(#waveGrad1)"/>
    <circle cx="145" cy="400" r="5" fill="#10b981" opacity="0.8"/>
    <circle cx="120" cy="410" r="3.5" fill="#059669" opacity="0.5"/>
  </g>

  <!-- 5. Acoustic Sparkle Dot (Authentic Sound Fidelity) -->
  <circle cx="335" cy="155" r="4" fill="#ffffff"/>
  <circle cx="175" cy="385" r="3" fill="#ffffff" opacity="0.9"/>
</svg>
