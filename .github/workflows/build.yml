name: Build & Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build Multi-Arch Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install ARM cross-compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf

      - name: Build AMD64 Binary
        run: |
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/senandung-linux-amd64 .

      - name: Build ARM64 Binary (STB HG680P / Odroid C2)
        run: |
          CGO_ENABLED=1 CC=aarch64-linux-gnu-gcc GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o dist/senandung-linux-arm64 .

      - name: Build ARMv7 Binary (32-bit SBCs)
        run: |
          CGO_ENABLED=1 CC=arm-linux-gnueabihf-gcc GOOS=linux GOARCH=arm GOARM=7 go build -ldflags="-s -w" -o dist/senandung-linux-armv7 .

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: senandung-binaries
          path: dist/*
