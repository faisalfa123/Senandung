name: Build & Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    name: Build Multi-Arch Binaries & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Binaries (Pure Go Static)
        run: |
          mkdir -p dist
          # AMD64 / x86_64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/senandung-linux-x86_64 .
          # ARM64 (Mastermind required asset)
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o dist/senandung-linux-arm64 .
          # ARM64 compatibility alias
          cp dist/senandung-linux-arm64 dist/senandung-linux-aarch64
          # ARMv7 32-bit SBCs
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -ldflags="-s -w" -o dist/senandung-linux-armv7l .

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum senandung-linux-arm64 senandung-linux-aarch64 senandung-linux-armv7l senandung-linux-x86_64 > checksums.txt
          cat checksums.txt

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: senandung-binaries
          path: dist/*

      - name: Publish GitHub Release Assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/senandung-linux-arm64
            dist/senandung-linux-aarch64
            dist/senandung-linux-armv7l
            dist/senandung-linux-x86_64
            dist/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
